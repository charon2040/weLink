    restart: unless-stopped
    ports:
      - "3314:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: welink_msg_07
      TZ: Asia/Shanghai
    volumes:
      - mysql-shard-7-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=500
