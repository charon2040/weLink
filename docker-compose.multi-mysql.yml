# =============================================================================
# WeLink 分库分套件 — 8 分片 MySQL + 1 主库 + Redis + Kafka + MinIO
# 启动: docker compose -f docker-compose.multi-mysql.yml up -d
# 重建: pwsh -File jmeter/scripts/rebuild-middleware.ps1
# =============================================================================

services:

  # ── 8 个分片 MySQL (ds0 ~ ds7) ──────────────────────────────────────────
  mysql-shard-0:
    image: mysql:8.0
    container_name: welink-mysql-shard-0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: welink_msg_00
      TZ: Asia/Shanghai
    volumes:
      - mysql-shard-0-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-shard-1:
    image: mysql:8.0
    container_name: welink-mysql-shard-1
    restart: unless-stopped
    ports:
