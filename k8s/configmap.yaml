apiVersion: v1
kind: ConfigMap
metadata:
  name: welink-config
  labels:
    app: welink
data:
  application.properties: |
    spring.application.name=WeLink

    # MySQL
    spring.datasource.url=jdbc:mysql://mysql:3306/welink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    spring.datasource.username=${MYSQL_USER:root}
    spring.datasource.password=${MYSQL_PASSWORD}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.datasource.hikari.maximum-pool-size=100
    spring.profiles.active=singledb
    spring.datasource.hikari.minimum-idle=20
    spring.datasource.hikari.connection-timeout=5000
    spring.datasource.hikari.idle-timeout=600000
    spring.datasource.hikari.max-lifetime=1800000

    # Redis
    spring.data.redis.host=${WELINK_REDIS_HOST:redis-cluster}
    spring.data.redis.port=${WELINK_REDIS_PORT:6379}
    spring.data.redis.timeout=5000

    # Kafka
    spring.kafka.bootstrap-servers=${WELINK_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
    spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
    spring.kafka.producer.acks=all
    spring.kafka.producer.retries=10
    spring.kafka.producer.properties.enable.idempotence=true
    spring.kafka.consumer.properties.spring.json.trusted.packages=*
    spring.kafka.consumer.auto-offset-reset=latest
    welink.im.ingress.consumer-group=welink-im-private-ingress
    welink.im.group-ingress.consumer-group=welink-im-group-ingress
    welink.kafka.private-ingress-concurrency=16
    welink.kafka.partitions.private-ingress=16
    welink.kafka.group-ingress-concurrency=16
    welink.kafka.partitions.group-ingress=16

    # MinIO
    welink.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
    welink.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
    welink.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
    welink.minio.bucket-name=welink

    # JWT
    welink.jwt.secret=${JWT_SECRET:WeLinkJwtSecretKey2026VeryLongSecretKeyForSecurity}
    welink.jwt.access-token-expiration=7200000
    welink.jwt.refresh-token-expiration=604800000

    # Instance
    welink.instance.id=${POD_NAME:instance-1}

    # Kafka Consumer Group (per-instance)
    welink.im.consumer-group=welink-im-${welink.instance.id:instance-1}
    welink.internal.secret=${WELINK_INTERNAL_SECRET:welink-internal-default-secret-change-me}

    # WebSocket
    welink.websocket.port=8081
    welink.websocket.heartbeat-timeout=60
    welink.websocket.io-threads=16
    welink.websocket.business-threads=48

    # Rate Limits
    welink.im.send-rate-limit-per-second=30
    welink.im.group-rate-limit-per-second=2
    welink.im.max-message-size=65536

    # Group Thresholds
    welink.im.medium-group-threshold=100
    welink.im.large-group-threshold=1000
    # Group rate limit is per-user-per-group, not per-group absolute

    # Degradation
    welink.degradation.level=0
    welink.degradation.read-receipt-enabled=true
    welink.degradation.presence-broadcast-enabled=false

    # Outbox
    welink.outbox.publish-interval-ms=1000
    welink.outbox.batch-size=1000
    welink.outbox.max-retries=6
    welink.outbox.base-retry-delay-seconds=5

    # Kafka Retry
    welink.im.kafka-retry.max-retries=3

    # Actuator
    management.endpoints.web.exposure.include=health,info,prometheus,metrics
    management.endpoint.health.show-details=always
    management.endpoint.health.probes.enabled=true
    management.metrics.export.prometheus.enabled=true
    management.metrics.distribution.percentiles-histogram.http.server.requests=true

    # Logging
    logging.level.com.epsilon.welink=info
    logging.level.org.springframework=info
    logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] %-5level [%thread] %logger{36} - %msg%n
