# =============================================================================
# Singledb profile — 单库模式（保留作为回退/调试）
# 用 --spring.profiles.active=singledb 激活
# 仅需一个 schema: welink
# =============================================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${WELINK_SINGLEDB_URL:jdbc:mysql://localhost:3307/welink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${WELINK_SINGLEDB_USERNAME:root}
spring.datasource.password=${WELINK_SINGLEDB_PASSWORD:123456}

# HikariCP 在单库下的池配置
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=WeLinkHikariPool
