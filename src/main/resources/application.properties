spring.application.name=WeLink
server.port=8080
server.tomcat.threads.max=1000
server.tomcat.accept-count=500
# 默认启用 sharding profile (8 个分片 MySQL + 1 个主 MySQL)。切回单库调试: --spring.profiles.active=singledb
spring.profiles.active=sharding

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# MyBatis-Plus Configuration
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.epsilon.welink.*.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=

# Redis Configuration
spring.data.redis.host=${WELINK_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${WELINK_REDIS_PORT:6379}
spring.data.redis.database=${WELINK_REDIS_DATABASE:0}
spring.data.redis.timeout=${WELINK_REDIS_TIMEOUT:5000}

# Kafka Configuration
spring.kafka.bootstrap-servers=${WELINK_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=300000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.batch.size=65536
spring.kafka.producer.properties.buffer.memory=67108864
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.max.poll.records=500
spring.kafka.consumer.properties.fetch.min.bytes=1024

# MinIO Configuration
welink.minio.endpoint=${WELINK_MINIO_ENDPOINT:http://localhost:9000}
welink.minio.access-key=${WELINK_MINIO_ACCESS_KEY:minioadmin}
welink.minio.secret-key=${WELINK_MINIO_SECRET_KEY:minioadmin}
welink.minio.bucket-name=${WELINK_MINIO_BUCKET_NAME:welink}

# JWT Configuration
welink.jwt.secret=${WELINK_JWT_SECRET:WeLinkJwtSecretKey2026VeryLongSecretKeyForSecurity}
welink.jwt.access-token-expiration=7200000
welink.jwt.refresh-token-expiration=604800000

# Instance ID for Distributed Deployment
welink.instance.id=${WELINK_INSTANCE_ID:instance-1}

# Internal endpoint shared secret (生产用 K8s Secret 注入)
welink.internal.secret=${WELINK_INTERNAL_SECRET:welink-internal-default-secret-change-me}

# Kafka Consumer Group (per-instance to ensure all instances receive every message)
welink.im.consumer-group=welink-im-${welink.instance.id:instance-1}
welink.im.ingress.consumer-group=${WELINK_IM_INGRESS_CONSUMER_GROUP:welink-im-private-ingress}
welink.im.group-ingress.consumer-group=${WELINK_IM_GROUP_INGRESS_CONSUMER_GROUP:welink-im-group-ingress}

# WebSocket Configuration
welink.websocket.port=8081
# 前端当前固定每 30s 发一次心跳; 后端 idle timeout 必须更大, 否则会在下次心跳前误踢
welink.websocket.heartbeat-timeout=300
welink.websocket.io-threads=16
welink.websocket.business-threads=48
welink.im.send-rate-limit-per-second=500
welink.im.group-rate-limit-per-second=300
# Group rate limit is per-user-per-group, not per-group absolute
welink.im.max-message-size=65536

# Outbox Configuration
welink.outbox.publish-interval-ms=1000
welink.outbox.batch-size=1000
welink.outbox.max-retries=6
welink.outbox.base-retry-delay-seconds=5
welink.kafka.private-ingress-concurrency=16
welink.kafka.partitions.private-ingress=16
welink.kafka.group-ingress-concurrency=16
welink.kafka.partitions.group-ingress=16

# Actuator / Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Degradation Levels (runtime adjustable via POST /admin/degradation/level/{0..5})
welink.degradation.level=0
welink.degradation.read-receipt-enabled=true
welink.degradation.presence-broadcast-enabled=false
welink.im.kafka-retry.max-retries=3
welink.im.large-group-threshold=1000
welink.im.medium-group-threshold=100

# Logging
logging.level.com.epsilon.welink=info
logging.level.org.springframework=info
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] %-5level [%thread] %logger{36} - %msg%n
