# =============================================================================
# Sharding profile — 通过 ShardingSphere Driver URL 加载 sharding-config.yaml
# 用 spring.profiles.active=sharding 激活
# =============================================================================

# 切换到 ShardingSphere Driver
spring.datasource.driver-class-name=org.apache.shardingsphere.driver.ShardingSphereDriver
spring.datasource.url=jdbc:shardingsphere:classpath:sharding-config.yaml?placeholder-type=environment

# HikariCP 连接池由 ShardingSphere 内部管理, Spring 这层不需要再配 max-pool-size
# 但保留这些配置避免 Spring 自动配置投诉
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=50

# MyBatis-Plus 必须显式关闭自带的事务管理器特殊处理 (避免与 ShardingSphere 事务冲突)
mybatis-plus.configuration.map-underscore-to-camel-case=true
